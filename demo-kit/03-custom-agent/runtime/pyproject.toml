[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zava-external-agent-runtime"
version = "1.0.0"
description = "HTTP runtime for the Zava external LangGraph agent."
requires-python = ">=3.12,<3.14"
dependencies = [
  "azure-identity>=1.25,<2",
  "azure-monitor-opentelemetry>=1.8,<2",
  "debugpy>=1.8,<2",
  "fastapi>=0.116,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "microsoft-opentelemetry>=1.0.0b57,<2",
  "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zava_external_agent"]
